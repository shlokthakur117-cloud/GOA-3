<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Verifier</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #001220, #00223E);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --muted-text: #a0aab2;
            --btn-bg: linear-gradient(90deg, #007bff, #00d2ff);
            --btn-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            --log-bg: rgba(0, 0, 0, 0.3);
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.1);
            --text-color: #333333;
            --muted-text: #666666;
            --btn-bg: linear-gradient(90deg, #007bff, #00d2ff);
            --btn-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
            --log-bg: rgba(0, 0, 0, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--muted-text);
            font-size: 24px;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Toggle Switch */
        .theme-toggle {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 5px;
            cursor: pointer;
        }
        .theme-toggle span {
            font-size: 16px;
            padding: 5px 10px;
            border-radius: 20px;
            transition: 0.2s;
        }
        .active-icon {
            background: white;
            color: black;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        h3 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted-text);
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        /* Custom File Upload Box */
        .file-upload-wrapper {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.1);
            transition: 0.2s;
        }
        
        .file-upload-wrapper:hover {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-icon {
            font-size: 30px;
            color: var(--muted-text);
        }

        #preview-img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            display: none;
        }

        #file-name {
            color: var(--muted-text);
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--btn-shadow);
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            color: #888;
        }

        #log {
            background: var(--log-bg);
            color: #a3be8c;
            padding: 20px;
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }

        .log-line { color: #ecf0f1; }
        .log-success { color: #a3be8c; font-weight: bold; }
        .log-error { color: #bf616a; font-weight: bold; }
        .log-link { color: #88c0d0; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>Blockchain Verifier</h1>
                <div class="subtitle" id="theme-text">Dark Mode</div>
            </div>
            <div class="theme-toggle" onclick="toggleTheme()">
                <span id="light-icon">☀️</span>
                <span id="dark-icon" class="active-icon">🌙</span>
            </div>
        </div>

        <div class="card">
            <h3>1. Configuration</h3>
            <label>Contract Address (from Hardhat deployment):</label>
            <input type="text" id="contractAddress" placeholder="0x5FbDB2315678afecb367f032d93F642f64180aa3">
        </div>

        <div class="card">
            <h3>2. Upload Face Scan</h3>
            
            <div class="file-upload-wrapper">
                <input type="file" id="imageInput" accept="image/jpeg, image/png" onchange="previewFile()">
                <div class="file-icon" id="file-icon-default">📄</div>
                <img id="preview-img" src="" alt="preview">
                <span id="file-name">Select an image...</span>
            </div>

            <button id="verifyBtn" onclick="runPipeline()">Run Verification Pipeline</button>
        </div>

        <div class="card">
            <h3>Pipeline Logs</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        const abi = [
            "function storeVerification(bytes32 _fingerprint, string _source, uint256 _timestamp) public",
            "function getVerification(bytes32 _fingerprint) public view returns (bytes32 fingerprint, string source, uint256 timestamp, address submitter)"
        ];

        const PRIVATE_KEY = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80";
        const RPC_URL = "http://127.0.0.1:8545";

        // Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('theme-text').innerText = isLight ? 'Light Mode' : 'Dark Mode';
            document.getElementById('light-icon').classList.toggle('active-icon', isLight);
            document.getElementById('dark-icon').classList.toggle('active-icon', !isLight);
        }

        // File Preview
        function previewFile() {
            const file = document.getElementById('imageInput').files[0];
            if (file) {
                document.getElementById('file-name').innerText = file.name;
                document.getElementById('file-icon-default').style.display = 'none';
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview-img');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // Logging
        function logMsg(msg, type='normal') {
            const logDiv = document.getElementById('log');
            let spanClass = 'log-line';
            
            if (type === 'success') spanClass = 'log-success';
            if (type === 'error') spanClass = 'log-error';
            
            // Format links automatically
            const formattedMsg = msg.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="log-link">$1</a>');
            
            logDiv.innerHTML += `<span class="${spanClass}">> ${formattedMsg}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function runPipeline() {
            const fileInput = document.getElementById('imageInput');
            const contractAddr = document.getElementById('contractAddress').value.trim();

            if (!contractAddr) return alert("Please enter the Contract Address first!");
            if (!fileInput.files.length) return alert("Please select an image!");

            document.getElementById('verifyBtn').disabled = true;
            document.getElementById('log').innerHTML = "";

            const file = fileInput.files[0];
            
            try {
                // 1. Backend Processing
                logMsg("Uploading image to AI Backend (Detect -> Search -> Match)...");
                const formData = new FormData();
                formData.append("image", file);

                const response = await fetch("http://127.0.0.1:5000/api/process", {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error);
                }

                logMsg(`AI Analysis Complete!`, 'success');
                logMsg(`Match Found: ${data.source}`);
                logMsg(`Generated SHA-256 Hash:\n${data.fingerprint}`);

                // 2. Blockchain Write
                logMsg("Connecting to Hardhat Blockchain...");
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const wallet = new ethers.Wallet(PRIVATE_KEY, provider);
                const contract = new ethers.Contract(contractAddr, abi, wallet);

                logMsg(`Submitting hash to blockchain from wallet:\n${wallet.address}`);
                
                const tx = await contract.storeVerification(data.fingerprint, data.source, data.timestamp);
                logMsg(`Transaction sent! Waiting for confirmation...\nHash: ${tx.hash}`);
                
                await tx.wait();
                logMsg("Transaction confirmed on local blockchain!", 'success');

                // 3. Blockchain Verify
                logMsg("Re-verifying record from blockchain...");
                const record = await contract.getVerification(data.fingerprint);
                
                logMsg(`Stored Hash:\n${record.fingerprint}`);
                
                if (record.fingerprint === data.fingerprint) {
                    logMsg("VERIFICATION PASSED: Frontend Hash == On-Chain Hash", 'success');
                } else {
                    logMsg("VERIFICATION FAILED: Hashes do not match!", 'error');
                }

            } catch (err) {
                logMsg(`ERROR: ${err.message}`, 'error');
            } finally {
                document.getElementById('verifyBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
